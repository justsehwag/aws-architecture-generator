version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "BEDROCK_REGION=$BEDROCK_REGION" >> .env.production
        - echo "BEDROCK_ACCESS_KEY_ID=$BEDROCK_ACCESS_KEY_ID" >> .env.production
        - echo "BEDROCK_SECRET_ACCESS_KEY=$BEDROCK_SECRET_ACCESS_KEY" >> .env.production
        - echo "LLM_PROVIDER=$LLM_PROVIDER" >> .env.production
        - echo "LLM_MODEL=$LLM_MODEL" >> .env.production
        - echo "DIAGRAMS_TABLE_NAME=$DIAGRAMS_TABLE_NAME" >> .env.production
        - echo "VERSIONS_TABLE_NAME=$VERSIONS_TABLE_NAME" >> .env.production
        - echo "TEMPLATES_TABLE_NAME=$TEMPLATES_TABLE_NAME" >> .env.production
        - echo "S3_DIAGRAM_BUCKET=$S3_DIAGRAM_BUCKET" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  computeSettings:
    timeout: 120
